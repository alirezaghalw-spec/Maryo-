  <style>
    :root { color-scheme: light; --ink:#231b28; --cream:#fff4d6; --teal:#26c6b6; --red:#f4513a; --yellow:#ffd166; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--teal); color:var(--ink); font-family:Arial,"Noto Sans Arabic",sans-serif; }
    #canvas { display:block; width:100%; height:100%; outline:none; }
    #loading { position:fixed; inset:0; display:grid; place-content:center; gap:18px; padding:28px; text-align:center; overflow:auto; background:var(--teal); isolation:isolate; }
    #loading::before { content:""; position:fixed; inset:0; z-index:-2; background:radial-gradient(circle at 18% 20%, #ffd166 0 72px, transparent 74px), linear-gradient(145deg, transparent 0 38%, #5b8bbf 38% 48%, #2a7e7e 48% 63%, #f4513a 63% 100%); }
    #loading::after { content:""; position:fixed; inset:0; z-index:-1; opacity:.18; background-image:radial-gradient(var(--ink) 1.5px, transparent 1.5px); background-size:22px 22px; pointer-events:none; }
    #card { width:min(560px, calc(100vw - 44px)); margin:auto; padding:30px 30px 26px; background:var(--cream); border:7px solid var(--ink); border-radius:28px; box-shadow:0 16px 0 rgba(35,27,40,.25); }
    #badge { display:inline-block; padding:6px 14px; margin-bottom:12px; background:var(--red); color:var(--cream); border:4px solid var(--ink); border-radius:14px; font-weight:800; letter-spacing:.08em; font-size:12px; direction:ltr; }
    h1 { margin:0 0 8px; font-size:clamp(30px, 7vw, 54px); line-height:1.05; }
    p { margin:8px 0; line-height:1.65; }
    #loading-status { font-weight:700; font-size:20px; }
    progress { display:block; width:min(360px, 100%); height:18px; margin:18px auto 8px; accent-color:var(--red); border:4px solid var(--ink); border-radius:20px; overflow:hidden; background:#f2a145; }
    progress::-webkit-progress-bar { background:#f2a145; }
    progress::-webkit-progress-value { background:var(--red); }
    progress::-moz-progress-bar { background:var(--red); }
    #loading-notice { max-width:420px; margin:0 auto; color:#6f5555; }
    button { min-height:48px; padding:10px 24px; cursor:pointer; font:inherit; font-weight:800; border:4px solid var(--ink); border-radius:14px; background:var(--teal); color:var(--cream); box-shadow:0 5px 0 var(--ink); }
    button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
    button:focus-visible { outline:4px solid var(--yellow); outline-offset:4px; }
    [hidden] { display:none !important; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
    @media (max-width:520px) { #card { padding:24px 18px 20px; border-width:5px; } h1 { font-size:34px; } }
  </style>

      <div id="badge">MUSHROOM MAYHEM / WEB</div>
      <h1 id="game-title">قارچ‌خورِ کمیک</h1>
      <p id="loading-status">در حال بارگذاری…</p>
      <progress id="loading-progress" max="1" value="0" aria-label="پیشرفت بارگذاری"></progress>
      <p id="loading-notice" hidden></p>
      <button id="loading-retry" type="button" hidden>تلاش دوباره</button>

<script>
    (() => {
      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11797296,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
      const threads = false;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      const title = document.getElementById('game-title');
      title.textContent = document.title || 'قارچ‌خورِ کمیک';
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      let downloadedBytes = 0;
      let lastProgressAt = performance.now();
      const startedAt = lastProgressAt;
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = 'بارگذاری بازی ناموفق بود؛ دوباره تلاش کنید.';
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        notice.textContent = performance.now() - lastProgressAt >= 30000
          ? 'هنوز پیشرفت تازه‌ای دیده نمی‌شود؛ کمی صبر کنید یا دوباره تلاش کنید.'
          : 'بازی هنوز در حال بارگذاری است؛ کمی صبر کنید یا دوباره تلاش کنید.';
      };
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloadedBytes) { downloadedBytes = current; lastProgressAt = performance.now(); }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = 'در حال بارگذاری…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total ? 'در حال شروع بازی…' : `${Math.floor(current / total * 100)}٪`;
      };
      const startupWatch = setInterval(updateNotice, 1000);
      const stop = () => clearInterval(startupWatch);
      window.addEventListener('error', event => fail(event.error || new Error('Engine startup error')));
      window.addEventListener('unhandledrejection', event => fail(event.reason || new Error('Engine startup rejected')));
      const start = async () => {
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stop();
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config.focusCanvas) canvas.focus();
          }));
        } catch (error) { fail(error); }
      };
      const script = document.createElement('script');
      script.src = 'index.js';
      script.addEventListener('load', start, { once:true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once:true });
      document.head.appendChild(script);
    })();
  </script>
